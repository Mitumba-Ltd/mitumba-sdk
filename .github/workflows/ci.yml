name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Typecheck
        run: npm run typecheck
        
      - name: Run tests with coverage
        run: npm run test:coverage
        
      - name: Build package
        run: npm run build
